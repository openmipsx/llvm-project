# Execution tests: programs compiled by llc, linked with the MIPS-X SDK's
# crt0 and sim.ld by ld.lld, and run on the SDK's simulator, which reports
# pipeline hazards (docs/abi.md section 9) as errors.
#
# Point MIPSX_SDK (or the lit parameter mipsx_sdk) at a mipsx-sdk checkout
# whose simulator is built (make in mipsx-sdk). Without it, or without
# ld.lld, these tests are unsupported.
import os

sdk = lit_config.params.get("mipsx_sdk") or os.environ.get("MIPSX_SDK")
lld = os.path.join(config.llvm_tools_dir, "ld.lld")
if (
    not sdk
    or not os.path.exists(os.path.join(sdk, "sim", "build", "mipsx-sim"))
    or not os.path.exists(lld)
):
    config.unsupported = True
else:
    config.substitutions.append(
        ("%mipsx-run", os.path.join(sdk, "sim", "mipsx-run"))
    )
    config.substitutions.append(
        (
            "%mipsx-link",
            "%s %s --sdk %s --bin %s"
            % (
                config.python_executable,
                os.path.join(os.path.dirname(__file__), "Inputs", "mipsx-link.py"),
                sdk,
                config.llvm_tools_dir,
            ),
        )
    )
