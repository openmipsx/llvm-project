# Execution tests: C programs compiled and linked by the clang driver
# against the MIPS-X SDK's run-time, and run on the SDK's simulator, which
# reports pipeline hazards (docs/abi.md section 9) as errors.
#
# Point MIPSX_SDK (or the lit parameter mipsx_sdk) at a mipsx-sdk checkout
# with the simulator built (make) and the run-time sysroot built (make
# sysroot MIPSX_LLVM_BIN=<llvm build>/bin). Without them, or without ld.lld,
# these tests are unsupported.
import os

sdk = lit_config.params.get("mipsx_sdk") or os.environ.get("MIPSX_SDK")
sysroot = os.path.join(sdk, "build", "sysroot") if sdk else None
if (
    not sdk
    or not os.path.exists(os.path.join(sdk, "sim", "build", "mipsx-sim"))
    or not os.path.exists(os.path.join(sysroot, "lib", "crt0.o"))
    or not os.path.exists(os.path.join(config.llvm_tools_dir, "ld.lld"))
):
    config.unsupported = True
else:
    config.substitutions.append(
        ("%mipsx-run", os.path.join(sdk, "sim", "mipsx-run"))
    )
    config.substitutions.append(("%mipsx-sysroot", sysroot))
